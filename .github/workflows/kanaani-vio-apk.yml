name: Build KANAANI VIO APK

# Push on main = signed release for customers (picked up by the panel's Cloudflare copy).
# Any other branch: run by hand (Actions → Run workflow) for a test build, nothing is published.
on:
  push:
    branches: [main]
    paths-ignore: ["CLAUDE.md", "README.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kanaani-vio-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Fixed signing key (Secrets): only then does an update install over the old app.
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.BRAND_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.BRAND_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BRAND_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BRAND_KEY_PASSWORD }}
        run: |
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/brand.jks"
            KP="$(trim "$KEY_PASS")"; [ -n "$KP" ] || KP="$(trim "$KS_PASS")"
            {
              echo "storeFile=$RUNNER_TEMP/brand.jks"
              echo "storePassword=$(trim "$KS_PASS")"
              echo "keyAlias=$(trim "$KEY_ALIAS")"
              echo "keyPassword=$KP"
            } > keystore.properties
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::BRAND_KEYSTORE_B64 secret is missing — the APK is not signed with the release key."
          fi

      - name: Build
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease --console=plain --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/KANAANI-VIO.apk
          ls -la out

      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          IFS=. read -r MA MI PA < VERSION
          CODE=$((MA * 10000 + MI * 100 + PA))
          SHA=$(sha256sum out/KANAANI-VIO.apk | cut -d' ' -f1)
          SIZE=$(stat -c %s out/KANAANI-VIO.apk)
          CODE="$CODE" SHA="$SHA" SIZE="$SIZE" TAG="$TAG" python3 - <<'PY'
          import json, os
          v = open("VERSION").read().strip()
          notes = open("update-notes.txt", encoding="utf-8").read().strip() if os.path.exists("update-notes.txt") else ""
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}/KANAANI-VIO.apk"
          data = {
              "versionCode": int(os.environ["CODE"]), "versionName": v, "apk": url, "url": url,
              "sha256": os.environ["SHA"], "size": os.environ["SIZE"], "notes": notes,
          }
          open("out/update.json", "w", encoding="utf-8").write(json.dumps(data, ensure_ascii=False))
          PY
          cat out/update.json
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/KANAANI-VIO.apk out/update.json --clobber
          else
            gh release create "$TAG" out/KANAANI-VIO.apk out/update.json --target "$GITHUB_SHA" \
              --title "KANAANI VIO $TAG" \
              --notes "KANAANI VIO — based on IPVIO Stream (GPL-3.0). Source code: this repository." --latest
          fi
